org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft / Forge
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.10
forge_version_range=[47,)
loader_version_range=[47,)

# Parchment mappings: official Mojang names plus community parameter names
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03

# Mod
mod_id=projectex
mod_name=ProjectEX Prime
mod_license=LGPL-3.0-only
mod_version=1.20.1-1.0.0
mod_group_id=dev.miguellopesdel.projectex
mod_authors=LatvianModder (original mod), MiguelLopesDel (1.20.1 port)
mod_description=Unofficial 1.20.1 port of ProjectEX, an extension mod for ProjectE.\nAdds EMC links, collectors, relays, power flowers, matter blocks and the Final Star.

# Dependencies
# ProjectE has no public maven, so it is pulled from CurseForge by file id.
# 4901949 = ProjectE-1.20.1-PE1.0.1.jar
projecte_curse_project_id=226410
projecte_file_id=4901949
jei_version=15.8.2.26
# GuideME renders the in game guide. It is bundled inside this mod's jar, so a
# player never has to download it separately.
guideme_version=20.1.15
